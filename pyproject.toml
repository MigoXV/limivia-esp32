[project]
name = "limivia-esp32"
version = "0.1.0"
description = "LIMIVIA ESP32 专用固件的构建、烧录和实机验证工具"
authors = [{name = "migo", email = "1695587905@qq.com"}]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["typer>=0.15,<1", "pyserial>=3.5,<4"]

[tool.poetry]
packages = [{include = "limivia_esp32", from = "src"}]

[tool.poetry.scripts]
limivia-esp32 = "limivia_esp32.commands.app:app"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
ruff = ">=0.11,<1"

[tool.ruff]
target-version = "py310"
line-length = 100

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
